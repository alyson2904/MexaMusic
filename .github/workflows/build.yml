
name: Crear APKs MexaMusic

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_debug:
    name: Build Debug APK
    runs-on: ubuntu-latest

    env:
      METROLIST_APPLICATION_ID: com.alyson2904.mexamusic
      METROLIST_APP_NAME: MexaMusic

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permisos a Gradle
        run: chmod +x gradlew

      - name: Generar Android Debug Keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Compilar APK Debug
        run: ./gradlew --no-daemon --console=plain assembleGmsDebug --warning-mode summary

      - name: Buscar APK Debug
        id: find_apk
        shell: bash
        run: |
          APK_PATH="$(find app/build/outputs/apk/gms/debug -type f -name '*.apk' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "No se encontró la APK Debug."
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "APK encontrada: $APK_PATH"

      - name: Guardar APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: MexaMusic-debug
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 7

  build_release:
    name: Build Release APK
    runs-on: ubuntu-latest

    env:
      METROLIST_APPLICATION_ID: com.alyson2904.mexamusic
      METROLIST_APP_NAME: MexaMusic

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permisos a Gradle
        run: chmod +x gradlew

      - name: Compilar APK Release
        run: ./gradlew --no-daemon --console=plain assembleGmsRelease --warning-mode summary

      - name: Guardar APK Release sin firmar
        uses: actions/upload-artifact@v4
        with:
          name: MexaMusic-release-unsigned
          path: app/build/outputs/apk/gms/release/*.apk
          if-no-files-found: warn
          retention-days: 7
          
