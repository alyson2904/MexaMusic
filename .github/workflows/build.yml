
name: Build APKs

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - "README.md"
      - "fastlane/**"
      - "assets/**"
      - ".github/**/*.md"
      - ".github/FUNDING.yml"
      - ".github/ISSUE_TEMPLATE/**"

permissions:
  contents: write
  discussions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_release:
    name: Build Release (${{ matrix.variant }})
    if: github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: gms
            variantName: Gms

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew --no-daemon --console=plain assemble${{ matrix.variantName }}Release --warning-mode summary
        env:
          METROLIST_APPLICATION_ID: com.metrolist.music
          METROLIST_APP_NAME: MexaMusic
          METROLIST_BUILD_COMMIT: ${{ github.sha }}
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Sign Release APK
        uses: ilharp/sign-android-release@v2.0.0
        with:
          releaseDir: app/build/outputs/apk/${{ matrix.variant }}/release/
          signingKey: ${{ secrets.KEYSTORE }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 36.0.0

      - name: Prepare Release APK
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT_DIR="app/build/outputs/apk/${{ matrix.variant }}/release"
          mkdir -p "$OUTPUT_DIR/out"

          APK_FILE="$(find "$OUTPUT_DIR" -maxdepth 1 -type f \( -name "*-signed.apk" -o -name "*-unsigned-signed.apk" \) -print -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "No se encontró la APK firmada."
            find "$OUTPUT_DIR" -maxdepth 2 -type f -print
            exit 1
          fi

          cp "$APK_FILE" "$OUTPUT_DIR/out/MexaMusic-release.apk"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: MexaMusic-release
          path: app/build/outputs/apk/${{ matrix.variant }}/release/out/MexaMusic-release.apk
          if-no-files-found: error
          retention-days: 7

  build_debug:
    name: Build Debug (${{ matrix.variant }})
    if: github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: gms
            variantName: Gms

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew --no-daemon --console=plain assemble${{ matrix.variantName }}Debug --warning-mode summary
        env:
          METROLIST_APPLICATION_ID: com.metrolist.music
          METROLIST_APP_NAME: MexaMusic
          METROLIST_BUILD_COMMIT: ${{ github.sha }}
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MexaMusic-debug
          path: app/build/outputs/apk/${{ matrix.variant }}/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  publish_nightly:
    name: Publish Nightly Release
    if: github.event_name == 'push'
    needs: [build_release, build_debug]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download Signed APK
        uses: actions/download-artifact@v4
        with:
          name: MexaMusic-release
          path: nightly

      - name: Publish Nightly Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          mv nightly/MexaMusic-release.apk nightly/MexaMusic.apk

          cat > nightly-notes.md <<EOF
          Compilación automática de MexaMusic.
          Commit: $GITHUB_SHA
          Esta versión puede contener errores.
          EOF

          if gh release view nightly > /dev/null 2>&1; then
            gh release delete nightly --yes --cleanup-tag
          elif gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/nightly" > /dev/null 2>&1; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly"
          fi

          gh release create nightly \
            nightly/MexaMusic.apk \
            --target "$GITHUB_SHA" \
            --title "MexaMusic Nightly" \
            --notes-file nightly-notes.md \
            --prerelease \
            --latest=false
            
